services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finn
      POSTGRES_PASSWORD: finn
      POSTGRES_DB: finn
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://finn:finn@db:5432/finn
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes: [docs:/app/var]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  docs:
